name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Formatting and lints are platform-independent, so they run once rather than
  # three times.
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `startup_does_not_wait_for_the_classpath` in `crates/cli/tests/` needs
      # a JDK with `lib/src.zip`: with none there is no `src.zip` read to still
      # be in flight at shutdown, and the test panics rather than passing
      # quietly. That dependency used to be met only because the runner image
      # happens to preinstall a JDK, so a `JAVA_HOME` pointing at a JRE or a
      # jlink'd image turned CI red with what read like a product bug. Temurin
      # ships `lib/src.zip`; a distribution that does not would not do.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - name: Unit and integration tests
        run: cargo test --workspace --all-targets --no-fail-fast
      - name: Serde feature
        run: cargo test -p javelin-classpath --features serde

  # The crates from the parser down to the index also build for WASI, which has no
  # threads (`CacheDb` walks the workspace sequentially there). Only `cargo check`: it
  # is what keeps a change to `read_facts` or `store_facts` from breaking that path
  # unnoticed. tree-sitter's grammar and the bundled SQLite are C, so this needs a
  # compiler that targets WASI and its libc headers.
  wasm:
    name: Check (wasm32-wasip1)
    runs-on: ubuntu-latest
    env:
      CC_wasm32_wasip1: clang
      # Debian's wasi-libc keeps its headers under wasm32-wasi, not wasm32-wasip1
      CFLAGS_wasm32_wasip1: -isystem /usr/include/wasm32-wasi
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Inside the checkout, so the target lands on the toolchain `rust-toolchain.toml` picks
      - run: rustup target add wasm32-wasip1
      - run: sudo apt-get update && sudo apt-get install -y clang wasi-libc
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-wasip1 -p javelin-parser -p javelin-semantic -p javelin-classpath -p javelin-index

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # Compiles the benchmarks without running them. Benchmark numbers from a shared
  # CI runner are noise; this only guards against the harness rotting.
  benchmarks:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p javelin-benchmarks --no-run
